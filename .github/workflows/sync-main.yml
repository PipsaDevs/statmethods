name: Sync Main to All Branches

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into active branches
        run: |
          git fetch --all

          FAILED_BRANCHES=()
          SUCCESS_BRANCHES=()

          # Safely stream remote branch names excluding HEAD and main
          git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v -E '^origin/(HEAD|main)$' | while read -r remote_branch; do
            branch="${remote_branch#origin/}"
            echo "----------------------------------------"
            echo "Syncing branch: $branch"

            # Create or reset local branch tracking remote head
            if ! git checkout -B "$branch" "$remote_branch"; then
              echo "Failed to checkout $branch"
              continue
            fi

            # Attempt merge from origin/main
            if git merge origin/main --no-edit; then
              if git push origin "$branch"; then
                echo "Successfully synced $branch"
                echo "| $branch | :white_check_mark: Synced |" >> $GITHUB_STEP_SUMMARY
              else
                echo "Failed to push $branch"
                echo "| $branch | :x: Push Failed (Protection Rule?) |" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "Merge conflict on $branch. Skipping."
              git merge --abort
              echo "| $branch | :warning: Merge Conflict |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Write Job Summary Header
        if: always()
        run: |
          echo "### Branch Sync Results" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
