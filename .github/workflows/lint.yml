name: Lint R Code

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  lint:
    name: Run lintr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install lintr
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr
          needs: lint

      - name: Lint R source files
        run: |
          lintr::lint_package()
        shell: Rscript {0}
