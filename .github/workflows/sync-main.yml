name: Sync Main to All Branches

on:
  push:
    branches: [main]

# Never run two syncs at once; a newer push waits for the running one.
concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into all branches
        run: |
          git fetch origin --prune
          failed=()

          while read -r branch; do
            [ "$branch" = "HEAD" ] && continue
            [ "$branch" = "main" ] && continue

            echo "---- $branch"

            # Nothing to do if the branch already contains main.
            if git merge-base --is-ancestor origin/main "origin/$branch"; then
              echo "Already up to date"
              continue
            fi

            # Orphan branches (e.g. gh-pages) share no history with main.
            if ! git merge-base origin/main "origin/$branch" > /dev/null 2>&1; then
              echo "::notice::Skipping $branch (no common history with main)"
              continue
            fi

            git checkout -q -B "$branch" "origin/$branch"

            if git merge origin/main --no-edit && git push origin "$branch"; then
              echo "Synced $branch"
            else
              echo "::warning::Could not sync $branch"
              git merge --abort 2>/dev/null || true
              failed+=("$branch")
            fi
          done < <(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin)

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed to sync: ${failed[*]}"
            exit 1
          fi
